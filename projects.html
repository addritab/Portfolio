<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projects</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* If your ears have lots of whitespace, this prevents weird layout shifts */
    pre { margin: 0; }

    .light-mode .nav {
    color: #6b7280;
    }

    .light-mode .nav:hover {
    color: black; 
    }
    
    .project-divider {
    border-bottom: 1px solid rgba(255, 255, 255, 0.10); /* dark mode divider */
    }

    .light-mode .project-divider {
    border-bottom: 1px solid rgba(0, 0, 0, 0.10); /* light mode divider */
    }

  </style>
</head>

<body id="page" class="bg-[#131313] text-white">
    <!-- THEME SYNC (matches whatever index.html saved in localStorage.theme) -->
    <script>
      (function () {
        const theme = localStorage.getItem("theme") || "dark";
        const page = document.getElementById("page");

        if (theme === "light") {
          page.classList.remove("bg-[#131313]", "text-white");
          page.classList.add("bg-white", "text-black");
        } else {
          page.classList.remove("bg-white", "text-black");
          page.classList.add("bg-[#131313]", "text-white");
        }
      })();
    </script>

    <a href="index.html"
    class="nav absolute top-8 left-12 right-12 flex justify-between items-center text-[15px] text-white opacity-70 transition
            text-white hover:text-white
            light:text-black light:hover:text-gray-500">
    &lt; return
    </a>

  <main class="relative z-10 max-w-5xl mx-auto px-10 pt-48 pb-10 translate-x-12 text-sm">
    <header class="mb-16">
      <h1 class="text-3xl font-medium">dev / design</h1>
      <p class="mt-3 opacity-60">
        below are few of my side projects that i have created and personally designed (portfolio included)
      </p>
    </header>

    <section id="projectsList" class="space-y-14"></section>
  </main>
  
  <script src="projects.js"></script>
  <div class="mt-2 text-center text-sm opacity-60">
    inspired by 
    <a href="https://astarryknight.github.io/"
      target="_blank"
      class="underline hover:opacity-100 transition">
      astarryknight.github.io
    </a>
  </div>

</body>
</html>
